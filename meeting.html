  <div class="content" style="color: white;">
    <h1>Timezone Schedule Converter</h1>
    <p>Enter meeting details below to generate your personalized World Time Buddy conversion link.</p>

    <p>
      <label for="date" style="color: white;"> Meeting Date (YYYY-MM-DD): </label>
      <input type="date" style="color: white;" id="date" required>
    </p>

    <p>
      <label for="startTime" style="color: white;">Start Hour (24hr format, e.g., 16): </label>
      <input style="color: white;" type="number" id="startTime" min="0" max="23" required>
    </p>

    <p>
      <label for="endTime">End Hour (24hr format, e.g., 17):</label>
      <input type="number" id="endTime" min="0" max="23" required>
    </p>

    <p>
      <label for="timezones">Timezone City IDs (comma-separated):</label>
      <input type="text" id="timezones" value="2172517,1857910,8,7,5128581" required>
    </p>

    <p>
      <label for="homeTimezone">Home Timezone ID:</label>
      <input type="text" id="homeTimezone" value="2172517" required>
    </p>

    <button onclick="generateLink()">Generate Link</button>

    <h3>Generated Conversion Link:</h3>
    <p id="result"><em>Your link will appear here.</em></p>

  </div>

  <footer style="text-align:center; padding:20px;">
    &copy; <em id="date"></em> Humphrey Yang | My homebrewed website : )
  </footer>

  <!-- Javascript -->
  <script>
    function generateLink() {
      const date = document.getElementById('date').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const tzs = document.getElementById('timezones').value.replace(/\s/g, '');
      const homeTZ = document.getElementById('homeTimezone').value;
      if (!date || !startTime || !endTime || !tzs || !homeTZ) {
        alert('Please fill out all fields.');
        return;
      }

      const baseLink = `https://www.worldtimebuddy.com/?qm=1&lid=${tzs}&h=${homeTZ}&date=${date}&sln=${startTime}-${endTime}&hf=1`;
      document.getElementById('result').innerHTML = `<a href="${baseLink}" target="_blank">${baseLink}</a>`;
    }

    // Automatically update footer year
    document.getElementById('date').innerText = new Date().getFullYear();
  </script>
