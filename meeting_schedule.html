<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Meeting Availability</title>
  <link rel="icon" href="src/Stars.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
   
  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background-color: #333;
      color: #fff;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    
    th, td {
      border: 1px solid #555;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      user-select:none;
    }

    th {
      background-color: #444;
    }
    
    .available {
      background-color: #4caf50;
    }

    textarea, input {
      background-color: #555;
      border-radius:6px;
      width: 100%;
      padding: 10px;
      color: white;
      border:none;
      margin-bottom: 15px;
      resize:none;
    }

    button {
      background: #2196F3;
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius:6px;
    }
    
    button:hover {
      background-color: #1976D2;
    }

    .hidden{
      display: none;
    }
  </style>
</head>

<body>
  <h2>Weekly Meeting Availability (Canberra/Kyoto)</h2>
  <p>👉 All slots are initially marked as <strong style="color:#4caf50">AVAILABLE</strong>. Please click to mark slots that you are <strong>NOT available</strong> (removing green highlight).</p>

  <table id="availability-table">
    <tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr>
  </table>

  <textarea id="topic" placeholder="Enter your presentation topic here..."></textarea>

  <button onclick="submitForm()">Submit Availability</button>

  <p id="response"></p>

  <!-- Hidden Form -->
  <form class="hidden" id="gform" method="POST" action="https://script.google.com/macros/s/AKfycbzDrINEMyv8Y6zqYY53P-3BgQCdaleu_ExBxHdQjwV2ptpI7ePjNDR9ScuKzequAim8Uw/exec" target="hiddenIframe">
    <input name="Availability" id="formAvailability">
    <input name="Topic" id="formTopic">
  </form>

  <iframe name="hiddenIframe" id="hiddenIframe" class="hidden"></iframe>

<script>
const times = ["9-10 AM (7-8 AM)", "10-11 AM (8-9 AM)", "11-12 PM (9-10 AM)", "12-1 PM (10-11 AM)", "1-2 PM (11-12 PM)", "2-3 PM (12-1 PM)", "3-4 PM (1-2 PM)", "4-5 PM (2-3 PM)", "5-6 PM (3-4 PM)", "6-7 PM (4-5 PM)"];
const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const table = document.getElementById("availability-table");

times.forEach((time)=>{
  let row = table.insertRow();
  row.insertCell().innerText = time;
  days.forEach(()=>{
    let cell = row.insertCell();
    cell.classList.add("available");
    cell.onclick = ()=>cell.classList.toggle("available");
  });
});

function submitForm(){
  let availability={};
  days.forEach((day,col)=>{
    availability[day]=[];
    times.forEach((time,row)=>{
      let cell=table.rows[row+1].cells[col+1];
      if(cell.classList.contains("available"))
        availability[day].push(time);
    });
  });

  document.getElementById("formAvailability").value=JSON.stringify(availability);
  document.getElementById("formTopic").value=document.getElementById("topic").value.trim();

  document.getElementById("gform").submit();

  document.getElementById("response").innerHTML = "✅ Availability submitted successfully!";
}
</script>

<footer style="text-align:center;color:#aaa;margin-top:50px;">
  &copy; <span id='year'></span> Humphrey Yang | Scheduling System
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</footer>

</body>
</html>
