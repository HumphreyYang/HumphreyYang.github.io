<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Meeting Availability</title>
  <link rel="icon" href="src/Stars.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap">
  
  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      max-width: 850px;
      margin: auto;
      background: #333;
      color: #fff;
      padding: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #555;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      user-select:none;
    }

    th {
      background-color: #444;
    }

    .available {
      background-color: #4caf50; /* green indicates available*/
    }

    textarea, input {
      background: #555;
      color: #fff;
      border-radius:6px;
      width: 100%;
      padding: 10px;
      border:none;
      margin-bottom: 15px;
      resize:none;
    }

    button {
      background-color: #2196F3;
      color: #fff;
      border: none;
      padding:10px 15px;
      cursor:pointer;
      border-radius:6px;
    }

    button:hover {
      background-color: #1976D2;
    }

    .response{
      color:gold;margin-top:10px;
    }
  </style>
</head>

<body>
<h2>Weekly Availability Schedule (Canberra/Kyoto)</h2>
<p>All times below are initially marked as <strong style="color:#4caf50">AVAILABLE</strong>. Click on the times you are <strong>NOT AVAILABLE</strong> to unhighlight them.</p>

<table id="availability-table">
  <tr>
    <th>Time</th>
    <th>Monday</th>
    <th>Tuesday</th>
    <th>Wednesday</th>
    <th>Thursday</th>
    <th>Friday</th>
  </tr>
</table>

<textarea id="topic" placeholder="Enter your presentation topic here..."></textarea>

<button onclick="submitData()">Submit Availability</button>

<p id="responseMsg"></p>

<script>
const times = ["9-10AM (7-8AM)", "10-11AM (8-9AM)", "11-12PM (9-10AM)", "12-1PM (10-11AM)", "1-2PM (11-12PM)",
               "2-3PM (12-1PM)", "3-4PM (1-2PM)", "4-5PM (2-3PM)", "5-6PM (3-4PM)", "6-7PM (4-5PM)"];

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

const table = document.querySelector("#availability-table");
times.forEach(time=>{
  let row=table.insertRow();
  row.insertCell().innerText=time;
  days.forEach(()=>{
    let cell=row.insertCell();
    cell.classList.add("available"); // initially available
    cell.onclick=()=>cell.classList.toggle("available");
  });
});

function submitData(){
  const topic = document.getElementById("topic").value.trim();
  if(topic===""){alert("Please enter a topic."); return;}

  let personalAvailability = {};
  days.forEach((day,col)=>{
    personalAvailability[day]=[];
    times.forEach((time,row)=>{
      let cell=table.rows[row+1].cells[col+1];
      if(cell.classList.contains("available"))
        personalAvailability[day].push(time);
    });
  });

  const scriptURL='https://script.google.com/macros/s/AKfycbwIBB-bnftx5aSpHGFjmnv_SSPahWuk8x4e2kXfbNr6XcicpSctXYEtwvBZiSCmIIe_jQ/exec'; // Replace this with your Apps Script Deployment URL

  const formData=new FormData();
  formData.append("topic",topic);
  formData.append("availability",JSON.stringify(personalAvailability));

  fetch(scriptURL,{
    method:'POST',
    body:formData
  })
  .then(res=>res.json())
  .then(response=>{
    document.getElementById("responseMsg").innerHTML="✅ Availability and topic successfully submitted!";
  }).catch(e=>{ 
    console.error(e);
    alert("Something went wrong, check console!");
  });
}
</script>

<footer style="text-align:center;color:#aaa;margin-top:40px;">
  &copy; <em id="year"></em> Humphrey Yang | Meeting Scheduling System
</footer>
<script>document.querySelector('footer').innerHTML+='⏰ '+new Date().getFullYear();</script>

</body>
</html>
